{% extends 'base.html' %}

{% block title %}Editar Subproceso{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <h2 style="margin-bottom: 1.5rem;"><i class="fas fa-edit"></i> Editar Subproceso</h2>

    <div
        style="background: var(--surface-color); padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border-color);">
        <form method="post">
            <div class="input-group">
                <label for="codigo_proceso">Proceso Padre</label>
                <select name="codigo_proceso" id="codigo_proceso" required>
                    {% for p in procesos %}
                    <option value="{{ p['codigo'] }}" {% if p['codigo']==subproceso['codigo_proceso'] %}selected{% endif
                        %}>
                        {{ p['codigo'] }} - {{ p['nombre'] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="input-group">
                <label for="codigo">Código</label>
                <input type="text" name="codigo" id="codigo" maxlength="2" value="{{ subproceso['codigo'] }}" required>
            </div>

            <div class="input-group">
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" value="{{ subproceso['nombre'] }}" required>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
                <a href="{{ url_for('admin.gestion_subprocesos') }}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
