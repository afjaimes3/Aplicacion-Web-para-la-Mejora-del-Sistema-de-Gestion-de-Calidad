<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(10, 10)">
    <!-- Base Card/Doc -->
    <rect x="0" y="0" width="46" height="60" rx="8" fill="url(#primaryGrad)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))"/>
    
    <!-- Folded corner / decorative layer -->
    <path d="M 26 0 L 46 20 L 26 20 Z" fill="#38bdf8" opacity="0.6"/>
    <path d="M 0 0 L 26 0 L 46 20 L 46 60 L 0 60 Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Document lines -->
    <line x1="10" y1="24" x2="36" y2="24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="10" y1="34" x2="36" y2="34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="10" y1="44" x2="26" y2="44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Spark / AI Accent Badge -->
    <circle cx="44" cy="46" r="12" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="2"/>
    <path d="M 44 39 L 45.5 43.5 L 50 44 L 46.5 47 L 47.5 51.5 L 44 49 L 40.5 51.5 L 41.5 47 L 38 44 L 42.5 43.5 Z" fill="#ffffff"/>
  </g>
  
  <!-- Typography -->
  <text x="75" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1e293b" letter-spacing="-0.5">
    DOCS<tspan fill="#0284c7">APP</tspan>
  </text>
  <text x="75" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.5">
    GESTIÓN DOCUMENTAL
  </text>
</svg>
