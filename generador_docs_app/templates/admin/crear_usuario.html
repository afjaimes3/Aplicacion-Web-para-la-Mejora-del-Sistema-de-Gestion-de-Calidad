{% extends 'base.html' %}

{% block title %}Crear Usuario{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <h2 style="margin-bottom: 1.5rem;"><i class="fas fa-user-plus"></i> Crear Nuevo Usuario</h2>

    <div
        style="background: var(--surface-color); padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border-color);">
        <form method="post">
            <div class="input-group">
                <label for="username">Nombre de Usuario (Login)</label>
                <input type="text" name="username" id="username" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" required>
            </div>

            <div class="input-group">
                <label for="nombre_completo">Nombre Completo</label>
                <input type="text" name="nombre_completo" id="nombre_completo">
            </div>

            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" name="email" id="email">
            </div>

            <div class="input-group">
                <label for="rol">Rol</label>
                <select name="rol" id="rol">
                    <option value="user">Usuario Estándar</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Guardar Usuario
                </button>
                <a href="{{ url_for('admin.gestion_usuarios') }}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
