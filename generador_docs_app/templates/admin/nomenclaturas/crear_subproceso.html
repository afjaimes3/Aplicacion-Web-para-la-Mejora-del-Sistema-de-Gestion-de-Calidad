{% extends 'base.html' %}

{% block title %}Crear Subproceso{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px;">
    <h2 style="margin-bottom: 1.5rem;"><i class="fas fa-plus"></i> Nuevo Subproceso</h2>

    <div
        style="background: var(--surface-color); padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border-color);">
        <form method="post">
            <div class="input-group">
                <label for="codigo_proceso">Proceso Padre</label>
                <select name="codigo_proceso" id="codigo_proceso" required>
                    <option value="" disabled selected>-- Seleccione un Proceso --</option>
                    {% for p in procesos %}
                    <option value="{{ p['codigo'] }}">{{ p['codigo'] }} - {{ p['nombre'] }}</option>
                    {% endfor %}
                </select>
                <small style="color: var(--text-muted);">El subproceso pertenecerá a este proceso.</small>
            </div>

            <div class="input-group">
                <label for="codigo">Código (Letra)</label>
                <input type="text" name="codigo" id="codigo" maxlength="2" required placeholder="Ej: A">
                <small style="color: var(--text-muted);">Generalmente una sola letra.</small>
            </div>

            <div class="input-group">
                <label for="nombre">Nombre del Subproceso</label>
                <input type="text" name="nombre" id="nombre" required>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Guardar
                </button>
                <a href="{{ url_for('admin.gestion_subprocesos') }}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
