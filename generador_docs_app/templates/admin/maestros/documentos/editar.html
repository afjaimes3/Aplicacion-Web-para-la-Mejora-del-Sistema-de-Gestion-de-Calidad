{% extends 'base.html' %}

{% block title %}Editar Documento{% endblock %}

{% block content %}
<script>
    const SUBPROCESOS_DATA = {{ subprocesos_json | safe }};
    const VALOR_SUBPROCESO_PREVIO = "{{ documento.subproceso }}"; 
</script>

<div class="content-container">
    <div style="margin-bottom: 2rem;">
        <h2><i class="fas fa-edit"></i> Editar Documento</h2>
        <p style="color: var(--text-muted);">Actualice la información del documento: {{ documento.codigo }}</p>
    </div>

    <form method="post" class="standard-form">
        <div class="form-grid-responsive">
            <div class="form-group">
                <label for="macroproceso">Macroproceso</label>
                <select name="macroproceso" id="macroproceso" class="form-control" required>
                    <option value="">-- Seleccione Macroproceso --</option>
                    {% for m in macroprocesos %}
                    <option value="{{ m }}" {% if documento.macroproceso==m %}selected{% endif %}>{{ m }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="tipo_documento">Tipo de Documento</label>
                <select name="tipo_documento" id="tipo_documento" class="form-control" required>
                    <option value="">-- Seleccione Tipo --</option>
                    {% for t in tipos %}
                    <option value="{{ t.codigo }}" {% if documento.tipo_documento==t.codigo %}selected{% endif %}>{{
                        t.codigo }} - {{ t.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-grid-responsive" style="grid-template-columns: 1fr 2fr;">
            <div class="form-group">
                <label for="codigo">Código (Único)</label>
                <input type="text" name="codigo" id="codigo" class="form-control" value="{{ documento.codigo }}"
                    required>
            </div>
            <div class="form-group">
                <label for="nombre">Nombre del Documento</label>
                <input type="text" name="nombre" id="nombre" class="form-control" value="{{ documento.nombre }}"
                    required>
            </div>
        </div>

        <div class="form-grid-responsive">
            <div class="form-group">
                <label for="pro">Proceso</label>
                <select name="proceso" id="pro" class="form-control" required>
                    <option value="">-- Seleccione Proceso --</option>
                    {% for p in procesos %}
                    <option value="{{ p.codigo }}" {% if documento.proceso==p.codigo %}selected{% endif %}>{{ p.codigo
                        }} - {{ p.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="sp">Subproceso</label>
                <select name="subproceso" id="sp" class="form-control" required>
                    <option value="">-- Primero seleccione un Proceso --</option>
                </select>
            </div>
        </div>

        <div class="form-grid-responsive" style="grid-template-columns: 1fr 1fr 1fr;">
            <div class="form-group">
                <label for="version_actual">Versión Actual</label>
                <input type="text" name="version_actual" id="version_actual" class="form-control"
                    value="{{ documento.version_actual }}">
            </div>
            <div class="form-group">
                <label for="fecha_caducidad">Fecha de Caducidad</label>
                <input type="date" name="fecha_caducidad" id="fecha_caducidad" class="form-control"
                    value="{{ documento.fecha_caducidad }}">
            </div>
            <div class="form-group">
                <label for="responsable_lider">Responsable / Líder (Cargo)</label>
                <input type="text" name="responsable_lider" id="responsable_lider" class="form-control"
                    value="{{ documento.responsable_lider }}">
            </div>
        </div>

        <div class="form-group">
            <label for="url_sharepoint">URL SharePoint (Enlace al archivo físico)</label>
            <input type="url" name="url_sharepoint" id="url_sharepoint" class="form-control"
                value="{{ documento.url_sharepoint }}" placeholder="https://...">
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap;">
            <button type="submit" class="btn-primary">
                <i class="fas fa-save"></i> Guardar Cambios
            </button>
            <a href="{{ url_for('gestion_maestros.index_documentos') }}" class="btn-secondary">
                Cancelar
            </a>
        </div>
    </form>
</div>

<style>
    .form-grid-responsive {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 0.5rem;
    }

    @media (max-width: 768px) {
        .form-grid-responsive {
            grid-template-columns: 1fr !important;
        }
    }
</style>

<!-- Reutilizamos la lógica de cascada del main.js -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
