{% extends 'base.html' %}

{% block title %}Nuevo Formato{% endblock %}

{% block content %}
<script>
    const SUBPROCESOS_DATA = {{ subprocesos_json | safe }};
    const VALOR_SUBPROCESO_PREVIO = ""; 
</script>

<div class="content-container">
    <div style="margin-bottom: 2rem;">
        <h2><i class="fas fa-plus"></i> Registrar Nuevo Formato</h2>
        <p style="color: var(--text-muted);">Complete la información para el listado maestro de formatos.</p>
    </div>

    <form method="post" class="standard-form">
        <div class="form-grid-responsive">
            <div class="form-group">
                <label for="codigo">Código (Único)</label>
                <input type="text" name="codigo" id="codigo" class="form-control" placeholder="Ej: FR-DI-E-01" required>
            </div>
            <div class="form-group">
                <label for="nombre">Nombre del Formato</label>
                <input type="text" name="nombre" id="nombre" class="form-control"
                    placeholder="Nombre completo del formato" required>
            </div>
        </div>

        <div class="form-group">
            <label for="macroproceso">Macroproceso</label>
            <select name="macroproceso" id="macroproceso" class="form-control" required>
                <option value="">-- Seleccione Macroproceso --</option>
                {% for m in macroprocesos %}
                <option value="{{ m }}">{{ m }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-grid-responsive">
            <div class="form-group">
                <label for="pro">Proceso</label>
                <select name="proceso" id="pro" class="form-control" required>
                    <option value="">-- Seleccione Proceso --</option>
                    {% for p in procesos %}
                    <option value="{{ p.codigo }}">{{ p.codigo }} - {{ p.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="sp">Subproceso</label>
                <select name="subproceso" id="sp" class="form-control" required>
                    <option value="">-- Primero seleccione un Proceso --</option>
                </select>
            </div>
        </div>

        <div class="form-grid-responsive" style="grid-template-columns: 1fr 1fr 1fr;">
            <div class="form-group">
                <label for="version">Versión</label>
                <input type="text" name="version" id="version" class="form-control" placeholder="Ej: 1.0">
            </div>
            <div class="form-group">
                <label for="fecha_actualizacion">Fecha de Actualización</label>
                <input type="date" name="fecha_actualizacion" id="fecha_actualizacion" class="form-control">
            </div>
            <div class="form-group">
                <label for="fecha_caducidad">Fecha de Caducidad</label>
                <input type="date" name="fecha_caducidad" id="fecha_caducidad" class="form-control">
            </div>
        </div>

        <div class="form-group">
            <label for="url_sharepoint">URL SharePoint</label>
            <input type="url" name="url_sharepoint" id="url_sharepoint" class="form-control" placeholder="https://...">
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap;">
            <button type="submit" class="btn-primary">
                <i class="fas fa-save"></i> Guardar Formato
            </button>
            <a href="{{ url_for('gestion_maestros.index_formatos') }}" class="btn-secondary">
                Cancelar
            </a>
        </div>
    </form>
</div>

<style>
    .form-grid-responsive {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 0.5rem;
    }

    @media (max-width: 768px) {
        .form-grid-responsive {
            grid-template-columns: 1fr !important;
        }
    }
</style>

<!-- Reutilizamos la lógica de cascada del main.js -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% endblock %}
